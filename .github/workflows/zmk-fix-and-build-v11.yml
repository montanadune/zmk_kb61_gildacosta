on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user config
        uses: actions/checkout@v4

      - name: Build Firmware with Docker (Safe Solution)
        uses: caksoylar/zmk-build-action@v3
        with:
          recipe: info
          board: nice_nano_v2
          shield: keyball61_right
          config_path: config
