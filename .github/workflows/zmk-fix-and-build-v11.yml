on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user config
        uses: actions/checkout@v4

      - name: Setup Stable Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Compatible CMake 3.28 (Force Match)
        run: |
          # 最新のCMake 4による自爆エラーを完全に防ぐため、安定版の3.28.3を導入
          wget https://github.com
          chmod +x cmake-3.28.3-linux-x86_64.sh
          sudo ./cmake-3.28.3-linux-x86_64.sh --skip-license --prefix=/usr/local
          # 反映確認
          cmake --version

      - name: Initialize west workspace (Force Clean Setup)
        run: |
          pip3 install west
          URL1="https://github.com"
          URL2="zmkfirmware"
          URL3="zmk.git"
          FULL_GIT_URL="${URL1}/${URL2}/${URL3}"
          
          git clone --branch main "$FULL_GIT_URL" zmk_workspace
          cd zmk_workspace
          west init -l app/
          west update
          west zephyr-export

      - name: Install Zephyr toolchain (v0.16.8 for Zephyr v4)
        run: |
          SDK_HOST="https://github.com"
          SDK_PATH="zephyrproject-rtos/sdk-ng/releases/download/v0.16.8"
          SDK_FILE="zephyr-sdk-0.16.8_linux-x86_64_minimal.tar.xz"
          FULL_SDK_URL="${SDK_HOST}/${SDK_PATH}/${SDK_FILE}"
          
          wget "$FULL_SDK_URL"
          tar -xf zephyr-sdk-0.16.8_linux-x86_64_minimal.tar.xz
          ./zephyr-sdk-0.16.8/setup.sh -t arm-zephyr-eabi -c

      - name: Inject Keyball61 Right configuration
        run: |
          mkdir -p zmk_workspace/app/boards/shields/keyball61
          cp -r config/* zmk_workspace/app/boards/shields/keyball61/

      - name: Build Keyball61 Right Firmware (ZMK Studio Enabled)
        run: |
          export ZEPHYR_SDK_INSTALL_DIR=$(pwd)/zephyr-sdk-0.16.8
          cd zmk_workspace
          west build -s app -b nice_nano/nrf52840 -- -DSHIELD=keyball61_right -DZMK_CONFIG=$(pwd)/app/boards/shields/keyball61

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyball61_right_v2_with_studio
          path: zmk_workspace/build/zephyr/zmk.uf2
