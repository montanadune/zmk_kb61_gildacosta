on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user config
        uses: actions/checkout@v4

      - name: Initialize west workspace
        run: |
          pip3 install west
          # ZMK公式の公開リポジトリを確実に対象URLに指定してクローン
          git clone --branch main https://github.com zmk_workspace
          cd zmk_workspace
          west init -l app/
          west update
          west zephyr-export

      - name: Install Zephyr toolchain
        run: |
          # 途切れることのない完全なダウンロードURLを指定
          wget https://github.com
          tar -xf zephyr-sdk-0.16.3_linux-x86_64_minimal.tar.xz
          ./zephyr-sdk-0.16.3/setup.sh -t arm-zephyr-eabi -c

      - name: Inject Keyball61 Right configuration
        run: |
          mkdir -p zmk_workspace/app/boards/shields/keyball61
          cp -r config/* zmk_workspace/app/boards/shields/keyball61/

      - name: Build Keyball61 Right Firmware (ZMK Studio Enabled)
        run: |
          export ZEPHYR_SDK_INSTALL_DIR=$(pwd)/zephyr-sdk-0.16.3
          cd zmk_workspace
          west build -s app -b nice_nano_v2 -- -DSHIELD=keyball61_right -DZMK_CONFIG=$(pwd)/app/boards/shields/keyball61

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyball61_right_v2_with_studio
          path: zmk_workspace/build/zephyr/zmk.uf2
