on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user config
        uses: actions/checkout@v4

      - name: Initialize west workspace (Force Clean Setup)
        run: |
          pip3 install west
          URL1="https://github.com"
          URL2="zmkfirmware"
          URL3="zmk.git"
          FULL_GIT_URL="${URL1}/${URL2}/${URL3}"
          
          git clone --branch main "$FULL_GIT_URL" zmk_workspace
          cd zmk_workspace
          west init -l app/
          west update
          west zephyr-export

      - name: Install Zephyr toolchain
        run: |
          SDK_HOST="https://github.com"
          SDK_PATH="zephyrproject-rtos/sdk-ng/releases/download/v0.16.3"
          SDK_FILE="zephyr-sdk-0.16.3_linux-x86_64_minimal.tar.xz"
          FULL_SDK_URL="${SDK_HOST}/${SDK_PATH}/${SDK_FILE}"
          
          wget "$FULL_SDK_URL"
          tar -xf zephyr-sdk-0.16.3_linux-x86_64_minimal.tar.xz
          ./zephyr-sdk-0.16.3/setup.sh -t arm-zephyr-eabi -c

      - name: Inject Keyball61 Right configuration
        run: |
          mkdir -p zmk_workspace/app/boards/shields/keyball61
          cp -r config/* zmk_workspace/app/boards/shields/keyball61/

      - name: Build Keyball61 Right Firmware (ZMK Studio Enabled)
        run: |
          export ZEPHYR_SDK_INSTALL_DIR=$(pwd)/zephyr-sdk-0.16.3
          cd zmk_workspace
          # 最新のZMKに適合するよう、ボード指定を nice_nano/nrf52840 に修正
          west build -s app -b nice_nano/nrf52840 -- -DSHIELD=keyball61_right -DZMK_CONFIG=$(pwd)/app/boards/shields/keyball61

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyball61_right_v2_with_studio
          path: zmk_workspace/build/zephyr/zmk.uf2
