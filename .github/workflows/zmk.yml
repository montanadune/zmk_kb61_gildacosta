on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize west workspace (Force Correct URL)
        run: |
          pip3 install west
          # 正しいZMK公式リポジトリの完全なURLを指定
          west init -m https://github.com --mr main .
          
          # ローカルのconfigフォルダをZMKのシールド認識配下へ強制コピー
          mkdir -p app/boards/shields/keyball61 2>/dev/null || true
          cp -r config/* app/boards/shields/keyball61/ 2>/dev/null || true

      - name: Update modules
        run: |
          west update
          west zephyr-export

      - name: Install Zephyr toolchain
        run: |
          wget https://github.com
          tar -xf zephyr-sdk-0.16.3_linux-x86_64_minimal.tar.xz
          ./zephyr-sdk-0.16.3/setup.sh -t arm-zephyr-eabi -c

      - name: Build Keyball61 Right (ZMK Studio Enabled)
        run: |
          export ZEPHYR_SDK_INSTALL_DIR=$(pwd)/zephyr-sdk-0.16.3
          west build -s app -b nice_nano_v2 -- -DSHIELD=keyball61_right -DZMK_CONFIG=$(pwd)/config

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyball61_right_v2_with_studio
          path: build/zephyr/zmk.uf2
